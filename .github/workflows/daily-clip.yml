name: 오늘 문장 클립 영상

# 매일 12시(KST)에 워커가 문장 카드를 보낸 뒤, 그 문장이 실제로 들리는
# 유튜브 클립을 찾아 영상으로 뒤따라 보낸다. (TTS mp3 대체, 2026-09-01)
#
# 기본은 워커가 카드를 보낸 직후 workflow_dispatch 로 직접 띄우는 것이다.
# GitHub 예약은 혼잡하면 몇 시간씩 밀리거나 아예 안 뜬다(2026-09-02 첫날
# 12:08 예약이 통째로 증발). 그래서 예약은 예비 — 즉시호출이 실패했을 때
# 한 번 더 시도하는 용도이고, 이미 보냈으면 스크립트가 /today 의 clip_at
# 을 보고 바로 끝낸다.
on:
  workflow_dispatch:
  schedule:
    # 03:40 UTC(=KST 12:40). 즉시호출이 이미 처리했으면 곧장 종료.
    - cron: '40 3 * * *'

concurrency:
  group: daily-clip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: yt-dlp·ffmpeg 설치
        run: |
          pip install -U yt-dlp
          sudo apt-get install -y -qq ffmpeg

      - name: 클립 찾아 전송
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/daily_clip.py
